name: Build Desktop

# Настольная версия собирается отдельно от APK: свой проект в desktop/, свои
# зависимости, и её правки не должны гонять сборку под Android - и наоборот
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Тег релиза, например desktop-v1.0.0. Пусто - только сборка
        required: false
        type: string
      release_notes:
        description: Описание релиза
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

env:
  # Версия ядра закреплена: новое ядро - это новая сборка, а не сюрприз при
  # пересборке старого тега
  XRAY_VERSION: v26.3.27

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            xray_zip: Xray-windows-64.zip
            res_dir: windows
            tasks: packageMsi packageExe
          - os: ubuntu-22.04
            xray_zip: Xray-linux-64.zip
            res_dir: linux
            tasks: packageDeb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - uses: gradle/actions/setup-gradle@v4

    # Версия приложения - из тега релиза, иначе из build.gradle.kts
    - name: Resolve version
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        V="${RELEASE_TAG#desktop-}"
        V="${V#v}"
        if [ -n "$V" ]; then
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег должен выглядеть как desktop-v1.2.3, а не $RELEASE_TAG"
            exit 1
          fi
          echo "VERSION_ARG=-PwardVersion=$V" >> $GITHUB_ENV
        fi

    - name: Download Xray core
      run: |
        mkdir -p "resources/${{ matrix.res_dir }}"
        curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${{ matrix.xray_zip }}"
        unzip -o xray.zip -d "resources/${{ matrix.res_dir }}"
        rm xray.zip
        # Сопроводительные файлы архива ядра приложению не нужны
        rm -f "resources/${{ matrix.res_dir }}"/README.md "resources/${{ matrix.res_dir }}"/xray_no_window.*
        ls -la "resources/${{ matrix.res_dir }}"

    - name: Test
      run: ./gradlew test $VERSION_ARG

    - name: Package
      run: ./gradlew ${{ matrix.tasks }} $VERSION_ARG

    # jpackage пишет причину отказа в свои файлы, а не в вывод Gradle
    - name: Show packager logs
      if: failure()
      run: find build/compose/logs -type f -exec sh -c 'echo "== $1"; tail -n 60 "$1"' _ {} \;

    - name: Upload packages
      uses: actions/upload-artifact@v7
      with:
        name: desktop-${{ matrix.res_dir }}
        path: |
          desktop/build/compose/binaries/main/msi/*.msi
          desktop/build/compose/binaries/main/exe/*.exe
          desktop/build/compose/binaries/main/deb/*.deb
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect files
        run: |
          mkdir -p release-files
          find dist -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' \) -exec cp {} release-files/ \;
          (cd release-files && sha256sum * > SHA256SUMS-desktop.txt)
          ls -la release-files

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Ward Desktop ${{ inputs.release_tag }}
          body: ${{ inputs.release_notes }}
          files: release-files/*
          # Никогда не «последний релиз»: по /releases/latest приложение под
          # Android проверяет обновления, и настольный релиз там его сломал бы
          make_latest: false
          prerelease: false
